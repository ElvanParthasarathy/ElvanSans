<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elvan Sans - Font Preview</title>
    <style>
        /* Define Font Faces */
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-Regular.ttf'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-Italic.ttf'); font-weight: 400; font-style: italic; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-Medium.ttf'); font-weight: 500; font-style: normal; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-MediumItalic.ttf'); font-weight: 500; font-style: italic; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-SemiBold.ttf'); font-weight: 600; font-style: normal; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-SemiBoldItalic.ttf'); font-weight: 600; font-style: italic; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-Bold.ttf'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'Elvan Sans'; src: url('Elvan_Sans_Output/ElvanSans-BoldItalic.ttf'); font-weight: 700; font-style: italic; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .controls input[type="range"] {
            width: 300px;
        }

        .preview-section {
            font-family: 'Elvan Sans', sans-serif;
            margin-bottom: 50px;
        }

        .style-label {
            font-family: sans-serif;
            font-size: 14px;
            color: #888;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-block {
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .text-block p {
            margin: 10px 0;
        }

        .mixed-text {
            display: flex;
            gap: 20px;
        }
        
        .mixed-text > div {
            flex: 1;
            padding: 20px;
            background: #fcfcfc;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        /* Weights & Styles Classes */
        .w400 { font-weight: 400; }
        .w400-i { font-weight: 400; font-style: italic; }
        .w500 { font-weight: 500; }
        .w500-i { font-weight: 500; font-style: italic; }
        .w600 { font-weight: 600; }
        .w600-i { font-weight: 600; font-style: italic; }
        .w700 { font-weight: 700; }
        .w700-i { font-weight: 700; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Elvan Sans Preview</h1>
        
        <div class="controls">
            <label for="fontSize">Font Size: <span id="sizeValue">24px</span></label>
            <input type="range" id="fontSize" min="12" max="72" value="24">
        </div>

        <div id="previewContainer">
            <!-- JavaScript will populate this -->
        </div>

    </div>

    <script>
        const sizeSlider = document.getElementById('fontSize');
        const sizeValue = document.getElementById('sizeValue');
        const previewContainer = document.getElementById('previewContainer');

        const styles = [
            { label: 'Regular (400)', class: 'w400' },
            { label: 'Italic (400)', class: 'w400-i' },
            { label: 'Medium (500)', class: 'w500' },
            { label: 'Medium Italic (500)', class: 'w500-i' },
            { label: 'SemiBold (600)', class: 'w600' },
            { label: 'SemiBold Italic (600)', class: 'w600-i' },
            { label: 'Bold (700)', class: 'w700' },
            { label: 'Bold Italic (700)', class: 'w700-i' }
        ];

        const englishText = "Elvan Sans is a modern typeface designed for seamless typography and excellent readability across all digital platforms. The quick brown fox jumps over the lazy dog. 0123456789 !@#$%^&*()";
        
        const tamilText = "எலவன் சான்ஸ் ஒரு அழகான நவீன அச்சுமுகமாகும். இது சிறந்த வாசிப்பு அனுபவத்திற்காக சிறப்பாக வடிவமைக்கப்பட்டுள்ளது. 0123456789 !@#$%^&*() இந்தியா எனது தாய்நாடு, எல்லா இந்தியர்களும் என் உடன்பிறப்புகள்.";

        const mixedPassage = `
            Elvan Sans is a versatile font combining English and Tamil perfectly. 
            கல்வி என்பது அறிவின் திறவுகோல் (Education is the key to knowledge). 
            In 2026, typing numbers like 0123456789 looks clean in both languages. 
            எல்லா மனிதர்களும் சுதந்திரமாகவே பிறக்கின்றனர் (All human beings are born free).
        `;

        function renderPreviews() {
            previewContainer.innerHTML = '';
            
            styles.forEach(style => {
                const section = document.createElement('div');
                section.className = 'preview-section';
                
                section.innerHTML = `
                    <div class="style-label">${style.label}</div>
                    
                    <div class="mixed-text text-block ${style.class}">
                        <div>
                            <strong>English:</strong><br>
                            ${englishText}
                        </div>
                        <div>
                            <strong>Tamil (தமிழ்):</strong><br>
                            ${tamilText}
                        </div>
                    </div>
                    
                    <div class="text-block ${style.class}" style="padding: 20px; background: #fafafa; border-radius: 8px;">
                        <strong>Combined Passage:</strong><br>
                        ${mixedPassage}
                    </div>
                `;
                
                previewContainer.appendChild(section);
            });
        }

        // Initialize
        renderPreviews();

        // Handle font size slider
        sizeSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            sizeValue.textContent = size;
            const textBlocks = document.querySelectorAll('.text-block');
            textBlocks.forEach(block => {
                block.style.fontSize = size;
            });
        });
        
        // Initial setup for default size
        document.querySelectorAll('.text-block').forEach(block => {
            block.style.fontSize = '24px';
        });

    </script>
</body>
</html>
